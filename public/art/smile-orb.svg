      <stop offset="0.55" stop-color="#8C4725" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#061713" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSage" cx="0" cy="0" r="1" gradientTransform="translate(240 250) rotate(50) scale(390 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9C1B5" stop-opacity="0.48"/>
